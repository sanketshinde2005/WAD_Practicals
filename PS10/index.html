<!DOCTYPE html>
<html>

<head>
    <title>To-Do List</title>
    <style>
        body {
            font-family: Arial;
            text-align: center;
            margin-top: 50px;
        }

        input {
            padding: 8px;
            width: 250px;
        }

        button {
            padding: 8px;
            margin: 5px;
            cursor: pointer;
        }

        ul {
            list-style-type: none;
            padding: 0;
        }

        li {
            margin: 10px;
            background: #f9f9f9;
            display: inline-block;
            padding: 10px;
            border-radius: 5px;
            width: 350px;
        }
    </style>
</head>

<body>

    <h2>To-Do List (AJAX)</h2>

    <input type="text" id="taskInput" placeholder="What needs to be done?">
    <button onclick="addTask()">Add Task</button>

    <ul id="taskList"></ul>

    
    <script src="script.js"></script>

</body>

</html>
