<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Bookstore Manager</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 30px; }
        table { border-collapse: collapse; width: 100%; margin-top: 20px; }
        th, td { border: 1px solid #999; padding: 8px 12px; text-align: left; }
        th { background: #eee; }
        input { padding: 6px; margin-right: 6px; }
        button { padding: 6px 12px; cursor: pointer; }
    </style>
</head>
<body>
    <h1>Bookstore Manager</h1>
    <input id="title" placeholder="Title">
    <input id="author" placeholder="Author">
    <input id="price" type="number" placeholder="Price">
    <input id="year" type="number" placeholder="Year">
    <button onclick="addBook()">Add</button>

    <table>
        <thead><tr><th>Title</th><th>Author</th><th>Price</th><th>Year</th><th>Actions</th></tr></thead>
        <tbody id="tbody"></tbody>
    </table>

    <script>
        async function load() {
            const data = await (await fetch('/books')).json();
            document.getElementById('tbody').innerHTML = data.map(b =>
                `<tr><td>${b.title}</td><td>${b.author}</td><td>${b.price}</td><td>${b.year}</td>
                <td><button onclick="del('${b.title.replace(/'/g,"\\'")}')">Delete</button></td></tr>`
            ).join('');
        }

        async function addBook() {
            const body = { title: document.getElementById('title').value, author: document.getElementById('author').value, price: Number(document.getElementById('price').value), year: Number(document.getElementById('year').value) };
            await fetch('/books', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
            document.getElementById('title').value = ''; document.getElementById('author').value = ''; document.getElementById('price').value = ''; document.getElementById('year').value = '';
            load();
        }

        async function del(title) {
            await fetch('/books/' + encodeURIComponent(title), { method: 'DELETE' });
            load();
        }

        load();
    </script>
</body>
</html>
